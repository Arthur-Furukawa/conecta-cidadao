<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Benefícios — Conecta Cidadão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <div class="tela">
    <header>
      <h1 class="titulo">Benefícios</h1>
      <div class="divisor"></div>
      <div class="navegacao">
        <a class="voltar" href="index.html"><img src="assets/voltar.svg" alt="" width="40" height="40">Voltar</a>
        <a class="ouvir" href="#ouvir"><span class="alto-falante" aria-hidden="true">🔊</span>Ouvir esta página</a>
      </div>
      <nav class="trilha" aria-label="Você está em"><ol><li><a href="index.html">Início</a></li><li aria-current="page">Benefícios</li></ol></nav>
    </header>

    <main id="conteudo" class="principal">
      <p class="instrucao">Escolha um tipo de benefício.</p>
      <div class="grade">
        <div class="opcao opcao--em-breve" aria-disabled="true">
          <span class="opcao-rotulo">Renda/Bolsas</span>
          <span class="pilula pilula--alta"><img src="assets/dinheiro.svg" alt="" width="84" height="84"></span>
          <span class="selo-texto">Em breve</span>
        </div>
        <div class="opcao opcao--em-breve" aria-disabled="true">
          <span class="opcao-rotulo">Alimentação</span>
          <span class="pilula pilula--alta"><img src="assets/talheres.svg" alt="" width="84" height="84"></span>
          <span class="selo-texto">Em breve</span>
        </div>
        <div class="opcao opcao--em-breve" aria-disabled="true">
          <span class="opcao-rotulo">Moradia</span>
          <span class="pilula pilula--alta"><img src="assets/casa.svg" alt="" width="84" height="84"></span>
          <span class="selo-texto">Em breve</span>
        </div>
        <a class="opcao" href="beneficios-saude.html">
          <span class="opcao-rotulo">Saúde</span>
          <span class="pilula pilula--alta"><img src="assets/saude.svg" alt="" width="84" height="84"></span>
          <span class="selo-texto selo-texto--disponivel">Disponível</span>
        </a>
      </div>
    </main>

    <nav class="barra" aria-label="Navegação principal">
      <a href="index.html"><span class="barra-icone"><img src="assets/casa.svg" alt="" width="26" height="26"></span>Início</a>
      <a href="beneficios.html" aria-current="page"><span class="barra-icone"><img src="assets/coracao.svg" alt="" width="26" height="26"></span>Benefícios</a>
      <a href="local-atendimento.html"><span class="barra-icone"><img src="assets/local.svg" alt="" width="26" height="26"></span>Serviços</a>
      <a href="oportunidades.html"><span class="barra-icone"><img src="assets/maleta.svg" alt="" width="26" height="26"></span>Emprego</a>
      <a href="ajuda.html"><span class="barra-icone"><img src="assets/ajuda.svg" alt="" width="26" height="26"></span>Ajuda</a>
    </nav>
  </div>

  <div class="popup" id="ouvir" role="dialog" aria-modal="true" aria-label="Reproduzindo áudio">
    <a class="popup-fundo" href="#" aria-label="Fechar" tabindex="-1"></a>
    <div class="popup-cartao">
      <input class="popup-pausar sr-only" type="checkbox" id="pausar">
      <span class="popup-indicador"></span>
      <a class="popup-fechar" href="#" aria-label="Fechar áudio" title="Fechar">×</a>
      <p class="popup-status" aria-live="polite"><span aria-hidden="true">🔊</span><span class="tocando">Reproduzindo..</span><span class="pausado">Pausado</span></p>
      <label class="popup-play" for="pausar" title="Pausar / continuar"><span class="i-pausa" aria-label="Pausar">❚❚</span><span class="i-play" aria-label="Continuar">▶</span></label>
      <div class="popup-faixa"></div>
      <p class="popup-origem">Benefícios</p>
    </div>
  </div>
</body>
</html>
