<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Conecta Cidadão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <div class="tela">
    <header>
      <div class="inicio-cabecalho">
        <h1>CONECTA CIDADÃO</h1>
        <p>Bem vindo(a)</p>
      </div>
      <div class="divisor"></div>
      <div class="navegacao navegacao--so-ouvir">
        <a class="ouvir" href="#ouvir"><span class="alto-falante" aria-hidden="true">🔊</span>Ouvir esta página</a>
      </div>
    </header>

    <main id="conteudo" class="principal">
      <p class="instrucao">O que você procura hoje?</p>
      <nav class="grade grade--inicio" aria-label="Menu principal">
        <a class="opcao" href="beneficios.html">
          <span class="opcao-rotulo">Benefícios</span>
          <span class="pilula"><img src="assets/coracao.svg" alt="" width="64" height="64"></span>
        </a>
        <a class="opcao" href="local-atendimento.html">
          <span class="opcao-rotulo">Serviços<br>Próximos</span>
          <span class="pilula"><img src="assets/local.svg" alt="" width="64" height="64"></span>
        </a>
        <a class="opcao" href="oportunidades.html">
          <span class="opcao-rotulo">Emprego<br>e Cursos</span>
          <span class="pilula"><img src="assets/maleta.svg" alt="" width="64" height="64"></span>
        </a>
        <a class="opcao" href="ajuda.html">
          <span class="opcao-rotulo">Como Usar</span>
          <span class="pilula"><img src="assets/ajuda.svg" alt="" width="64" height="64"></span>
        </a>
      </nav>
    </main>

    <nav class="barra" aria-label="Navegação principal">
      <a href="index.html" aria-current="page"><span class="barra-icone"><img src="assets/casa.svg" alt="" width="26" height="26"></span>Início</a>
      <a href="beneficios.html"><span class="barra-icone"><img src="assets/coracao.svg" alt="" width="26" height="26"></span>Benefícios</a>
      <a href="local-atendimento.html"><span class="barra-icone"><img src="assets/local.svg" alt="" width="26" height="26"></span>Serviços</a>
      <a href="oportunidades.html"><span class="barra-icone"><img src="assets/maleta.svg" alt="" width="26" height="26"></span>Emprego</a>
      <a href="ajuda.html"><span class="barra-icone"><img src="assets/ajuda.svg" alt="" width="26" height="26"></span>Ajuda</a>
    </nav>
  </div>

  <div class="popup" id="ouvir" role="dialog" aria-modal="true" aria-label="Reproduzindo áudio">
    <a class="popup-fundo" href="#" aria-label="Fechar" tabindex="-1"></a>
    <div class="popup-cartao">
      <input class="popup-pausar sr-only" type="checkbox" id="pausar">
      <span class="popup-indicador"></span>
      <a class="popup-fechar" href="#" aria-label="Fechar áudio" title="Fechar">×</a>
      <p class="popup-status" aria-live="polite"><span aria-hidden="true">🔊</span><span class="tocando">Reproduzindo..</span><span class="pausado">Pausado</span></p>
      <label class="popup-play" for="pausar" title="Pausar / continuar"><span class="i-pausa" aria-label="Pausar">❚❚</span><span class="i-play" aria-label="Continuar">▶</span></label>
      <div class="popup-faixa"></div>
      <p class="popup-origem">CONECTA CIDADÃO</p>
    </div>
  </div>
</body>
</html>
